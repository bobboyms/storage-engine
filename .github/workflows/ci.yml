name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go mod tidy check
        run: go mod tidy -diff

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  vuln:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

  regular:
    name: regular tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Unit tests with coverage
        run: go test ./... -coverprofile=coverage.out

      - name: Enforce coverage gate (>= 70%)
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/{print $NF}' | tr -d '%')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 70.0) { print "Coverage " t "% is below the 70% minimum"; exit 1 } }'

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: coverage.out
          if-no-files-found: ignore

      - name: Race tests
        run: go test ./pkg/... -race

      - name: Chaos tests
        run: go test ./tests/chaos -tags chaos -count=1 -v

      - name: Stress tests with race detector
        run: go test ./tests/stress -tags stress -race -count=1 -v

  faults:
    name: disk fault tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run corruption fault tests
        run: go test ./tests/faults -tags faults -run 'TestFault(WAL|Heap|BTree)' -count=1 -v

      - name: Run required environmental fault tests
        run: make test-faults-env
